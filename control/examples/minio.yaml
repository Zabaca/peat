# A store for trying Peat: one MinIO (S3-compatible) in the cluster, with one bucket, `peat`. FOR TRIALS ONLY: one pod, no persistent volume
# (the data goes when the pod does), a root login written in this file. A real platform uses a real bucket and a key of its own.
#
#   kubectl apply -f minio.yaml
#   kubectl -n peat create secret generic peat-store --from-literal=AWS_ACCESS_KEY_ID=peat-try --from-literal=AWS_SECRET_ACCESS_KEY=peat-try-secret
#
# and a Platform whose objectStore is { endpoint: http://minio.minio.svc:9000, bucket: peat, credentialsSecret: peat-store } (trial.yaml's).
apiVersion: v1
kind: Namespace
metadata: { name: minio }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: minio }
spec:
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          env:
            - { name: MINIO_ROOT_USER, value: peat-try }
            - { name: MINIO_ROOT_PASSWORD, value: peat-try-secret }
            - { name: MINIO_DEFAULT_BUCKETS, value: peat }
          ports: [ { containerPort: 9000 } ]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 } }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: minio }
spec: { selector: { app: minio }, ports: [ { port: 9000 } ] }
