name: Peat CI

# Every change (pull requests, pushes to main): the release build and Neon's Rust tests,
# on arm64 and on amd64, each on its own native runner.
# Merges to main, release tags and manual runs: also Neon's Python regression suite on
# Postgres 18 on both, split into shards that each fit one standard GitHub-hosted runner
# (4 vCPU, 16 GB of memory, free and unlimited for public repositories), and the images,
# one per architecture, which the publish job joins into one multi-arch image per tag.
# No job needs a machine of ours. See README.md, "Continuous integration".

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'release-*' ]
  workflow_dispatch:

# The token has no permission unless a job asks for one. Pull requests from other
# repositories get a read-only token and no secrets (GitHub's rule for the pull_request
# event); nothing here uses pull_request_target, and only the image job, which never runs
# for a pull request, can write anything.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  BUILD_TYPE: release
  CARGO_FLAGS: --locked --features testing
  # No debug info in the release build: it halves the target directory, which has to fit
  # a 14 GB disk beside the Postgres trees and the toolchain.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  # The suite's shards; .github/peat/shard.py balances them by test-durations.json.
  REGRESS_SHARDS: '8'

jobs:
  build:
    name: build and Rust tests (${{ matrix.arch }}, release)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
    # Each architecture is built and tested on a native runner, never emulated; one failing
    # does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Free disk space
        run: .github/peat/free-disk.sh

      # The Rust dependencies' build, restored on every run and written only from pushes to
      # main: a pull request (an outsider's included) restores main's cache but never writes
      # one that main restores.
      # Keyed by Cargo.lock and the pinned toolchain only: rust-cache's own environment key
      # hashes every installed toolchain, and the runners' preinstalled stable one differs
      # between runner images, so no run restored the last one's cache (runs 44332625075
      # and 44338592127). A restore across a compiler change is safe: cargo rebuilds what
      # another rustc built.
      # Restored before install-deps.sh, so the nextest it downloads and checks is the one
      # that runs, not a copy from the cache's ~/.cargo/bin.
      # The action adds the runner's operating system and CPU architecture to the key itself
      # (v0-rust-<key>-build-Linux-arm64 and -Linux-x64), so the two architectures never
      # share a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install build dependencies
        run: .github/peat/install-deps.sh

      # Peat builds and tests Postgres 18 only (James, 2026-11-18). The walproposer library
      # the safekeeper's simulation tests link is built against 18 too (Makefile,
      # libs/walproposer/build.rs; Neon builds it against 17). What else the tree needs to
      # compile: the headers of 14 to 17, from which postgres_ffi generates its bindings.
      # Postgres is cached by the commits of its five trees, the build rules and what else
      # decides the build (runner image, compiler, build type); the cache is only
      # written from pushes to main, so nothing a pull request builds is restored elsewhere
      # (a pull request's own caches are confined to its merge ref anyway).
      - name: Postgres cache key
        id: pg
        run: |
          trees=$(git submodule status vendor/postgres-v14 vendor/postgres-v15 vendor/postgres-v16 vendor/postgres-v17 vendor/postgres-v18 | sha256sum | cut -c1-16)
          rules=$(cat Makefile postgres.mk .github/peat/install-deps.sh | sha256sum | cut -c1-16)
          # The runner image (its system libraries), the C compiler and the build type also
          # decide what the cached Postgres is, and it feeds the published images.
          compiler=$( (cc --version | head -1; mold --version) | sha256sum | cut -c1-12)
          echo "key=postgres-18full-hdr14to17-$BUILD_TYPE-${ImageOS:-unknown}-${ImageVersion:-unknown}-$(uname -m)-$compiler-$trees-$rules" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pg-cache
        with:
          path: |
            pg_install
            build/v18/src/test/regress
            build/v18/src/test/isolation
          key: ${{ steps.pg.outputs.key }}

      - name: Build Postgres (18 in full, headers of 14 to 17)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        run: mold -run make -j"$(nproc)" postgres-install-v18 postgres-headers-install

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pg-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            pg_install
            build/v18/src/test/regress
            build/v18/src/test/isolation
          key: ${{ steps.pg.outputs.key }}

      - name: Build (Neon, Neon's extension for 18, walproposer, Rust test binaries)
        run: |
          mold -run make -j"$(nproc)" PG_INSTALL_CACHED=1 neon neon-pg-ext-v18 CARGO_BUILD_FLAGS="$CARGO_FLAGS"
          read -ra flags <<< "$CARGO_FLAGS"
          mold -run cargo build "${flags[@]}" --release --tests
          df -h /

      # Fourteen Rust tests run programs of Postgres 14 to 17, which Peat does not build:
      # wal_craft's WAL crafting for 14 to 17 (twelve; 18's run) and the pageserver's two
      # short walredo tests, whose WAL records and expected page were made on 14 (18 rejects
      # those records). They are left out here, not removed. walredo's ping and stderr tests
      # run on 18.
      - name: Rust tests
        run: |
          read -ra flags <<< "$CARGO_FLAGS"
          old_pg='(package(wal_craft) & test(/^v1[4567]::xlog_utils_test::test_find_end_of_wal/)) | (package(pageserver) & test(/^walredo::tests::(short_v14_redo|short_v14_fails_for_wrong_key_but_returns_zero_page)$/))'
          cargo nextest run "${flags[@]}" --release --no-fail-fast -E "!package(pageserver) & !binary(test_real_gcs) & !($old_pg)"
          cargo nextest run "${flags[@]}" --release --no-fail-fast -E "package(pageserver) & !($old_pg)"
          cargo test --doc "${flags[@]}" --release

      - name: Pack the binaries for the regression suite
        if: github.event_name != 'pull_request'
        run: .github/peat/package-binaries.sh "$RUNNER_TEMP/peat-release-${{ matrix.arch }}.tar.zst"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: peat-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/peat-release-${{ matrix.arch }}.tar.zst
          retention-days: 1
          compression-level: 0

      # The images' programs are built again with the default features, as Neon builds its
      # release images: the suite's `--features testing` turns on the pageserver's test-only
      # HTTP API (setting fail points, forcing checkpoints, marking a tenant broken and more),
      # which an image must not carry. Fail points themselves are compiled into every build of
      # this workspace (workspace_hack turns on fail/failpoints), Neon's release images too.
      # After the pack above, since this overwrites target/release's copies of these programs.
      - name: Build the images' programs (default features)
        if: github.event_name != 'pull_request'
        run: mold -run cargo build --locked --release --bin storage_broker --bin storage_controller --bin safekeeper --bin pageserver --bin compute_ctl

      - name: Pack the images' build context
        if: github.event_name != 'pull_request'
        run: .github/peat/package-images.sh "$RUNNER_TEMP/peat-images-${{ matrix.arch }}.tar.zst"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: peat-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/peat-images-${{ matrix.arch }}.tar.zst
          retention-days: 7
          compression-level: 0

  regress:
    # No expression in the name: GitHub does not evaluate a skipped job's name (pull requests
    # skip this job), and appends the matrix (architecture, then shard 1 to 8 or solo) to a
    # plain one. Waits for both architectures' builds (a matrix job's needs cannot name one
    # leg), so a failed build of either skips every shard.
    name: regression suite, Postgres 18
    needs: [ build ]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
        # 'solo': the tests of .github/peat/solo-tests.txt, one at a time on a larger
        # filesystem (each peaks at about 12 GB of test output).
        shard: [ '1', '2', '3', '4', '5', '6', '7', '8', 'solo' ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The suite runs the upstream pg_regress and isolation tests from the Postgres source.
      - name: Postgres 18 source
        run: git submodule update --init --depth 1 vendor/postgres-v18

      - name: Free disk space
        run: .github/peat/free-disk.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the test suite's dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            libreadline8 libicu74 libseccomp2 libpq5 zstd lsof
          python -m pip install --quiet --require-hashes --no-deps -r .github/peat/poetry-requirements.txt
          ./scripts/pysync

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: peat-release-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the binaries
        run: |
          zstd -dc "$RUNNER_TEMP/peat-release-${{ matrix.arch }}.tar.zst" | tar -xf -
          rm "$RUNNER_TEMP/peat-release-${{ matrix.arch }}.tar.zst"

      # Sizes from measurements of each shard on 4 CPUs and 16 GiB: a shard's test output
      # peaked at 6.7 GB (11 GB keeps it under the pageserver's 80%); each solo test
      # alone peaked at about 12 GB (16 GB).
      - name: A filesystem of its own for the test output
        run: .github/peat/test-filesystem.sh "${{ matrix.shard == 'solo' && '16G' || '11G' }}" /mnt/test-output

      - name: Run the shard
        env:
          TEST_OUTPUT: /mnt/test-output/out
        run: .github/peat/run-shard.sh "${{ matrix.shard }}" "$REGRESS_SHARDS" 18 "${{ matrix.shard == 'solo' && '1' || '4' }}" "$RUNNER_TEMP/junit.xml"

      # Every rerun as a warning annotation and in the job's summary, its first attempt's
      # logs kept, even when the rerun passed and the job is green.
      - name: Report reruns
        if: ${{ !cancelled() }}
        run: python3 -I .github/peat/report_reruns.py "$RUNNER_TEMP/reruns.jsonl" /mnt/test-output/out "$RUNNER_TEMP/results"

      - name: Keep the shard's results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          cp "$RUNNER_TEMP/junit.xml" "$RUNNER_TEMP/results/" 2>/dev/null || true
          df -h /mnt/test-output / > "$RUNNER_TEMP/results/disk.txt" || true

      - name: Keep the logs of a failed shard
        if: failure()
        run: |
          find /mnt/test-output/out -name '*.log' -size -20M -print0 \
            | tar --null -T - -czf "$RUNNER_TEMP/results/logs.tar.gz" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: regress-pg18-${{ matrix.arch }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          retention-days: 7

  # The images are built and checked on every run but a pull request's, one per
  # architecture on a native runner, and saved as artifacts; the job after them pushes
  # exactly those images.
  images:
    # A plain name, for the reason the regression job's says: GitHub appends the architecture.
    name: build and check the images
    needs: [ build ]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
    # The IDs of the images this job checked, one pair per architecture (each leg writes
    # only its own names, which GitHub merges across the matrix): the publish job pushes
    # only images with these IDs, whatever the artifacts it downloads hold.
    outputs:
      storage-id-arm64: ${{ steps.ids.outputs.storage-id-arm64 }}
      compute-id-arm64: ${{ steps.ids.outputs.compute-id-arm64 }}
      storage-id-amd64: ${{ steps.ids.outputs.storage-id-amd64 }}
      compute-id-amd64: ${{ steps.ids.outputs.compute-id-amd64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: peat-images-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the build context
        run: |
          mkdir -p "$RUNNER_TEMP/ctx"
          zstd -dc "$RUNNER_TEMP/peat-images-${{ matrix.arch }}.tar.zst" | tar -C "$RUNNER_TEMP/ctx" -xf -
          cat "$RUNNER_TEMP/ctx/PROVENANCE"

      # The local tags carry the architecture, so the publish job can hold both.
      - name: Build the images
        run: |
          for image in storage compute; do
            docker build --build-arg REVISION="$GITHUB_SHA" \
              -f ".github/peat/$image.Dockerfile" -t "peat-$image:ci-${{ matrix.arch }}" "$RUNNER_TEMP/ctx"
          done
          docker image ls 'peat-*'

      - name: Check the images
        run: .github/peat/check-images.sh peat-storage:ci-${{ matrix.arch }} peat-compute:ci-${{ matrix.arch }}

      - name: Record the checked images' IDs
        id: ids
        run: |
          storage=$(docker image inspect --format '{{.Id}}' peat-storage:ci-${{ matrix.arch }})
          compute=$(docker image inspect --format '{{.Id}}' peat-compute:ci-${{ matrix.arch }})
          echo "storage-id-${{ matrix.arch }}=$storage" >> "$GITHUB_OUTPUT"
          echo "compute-id-${{ matrix.arch }}=$compute" >> "$GITHUB_OUTPUT"
          {
            echo "### Checked images (${{ matrix.arch }})"
            echo
            echo "| Image | ID |"
            echo "|---|---|"
            echo "| storage | $storage |"
            echo "| compute-pg18 | $compute |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the images
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker save peat-storage:ci-${{ matrix.arch }} peat-compute:ci-${{ matrix.arch }} | zstd -T0 -3 -q -o "$RUNNER_TEMP/images/peat-images.tar.zst"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peat-images-docker-${{ matrix.arch }}
          path: ${{ runner.temp }}/images/peat-images.tar.zst
          retention-days: 1
          compression-level: 0

  # Images are published only from this repository's own merges to main and release tags,
  # never from a pull request or a manual run, only after the regression suite passed on
  # both architectures, and only once the PUBLISH_IMAGES repository variable is 'true'.
  # This is the only job whose token can write (to the package registry). Names and tags:
  # README.md, "Images". Who can push to main or make a release-* tag is set by the
  # repository's rulesets (main through pull requests only; release tags created by admins
  # only, never moved); the job also refuses a commit that is not on main.
  publish-images:
    name: publish the images (arm64 and amd64)
    needs: [ images, regress ]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-')) &&
      vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release tag on a commit main never took would publish an unreviewed tree.
      - name: The commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main; not publishing"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: peat-images-docker-*
          path: ${{ runner.temp }}/archives

      # Both architectures' images, each compared with the ID its own images job checked.
      - name: Load the checked images
        env:
          STORAGE_ID_ARM64: ${{ needs.images.outputs.storage-id-arm64 }}
          COMPUTE_ID_ARM64: ${{ needs.images.outputs.compute-id-arm64 }}
          STORAGE_ID_AMD64: ${{ needs.images.outputs.storage-id-amd64 }}
          COMPUTE_ID_AMD64: ${{ needs.images.outputs.compute-id-amd64 }}
        run: |
          for arch in arm64 amd64; do
            zstd -dc "$RUNNER_TEMP/archives/peat-images-docker-$arch/peat-images.tar.zst" | docker load
          done
          for arch in arm64 amd64; do
            up=$(echo "$arch" | tr '[:lower:]' '[:upper:]')
            want_s=STORAGE_ID_$up; want_c=COMPUTE_ID_$up
            loaded_s=$(docker image inspect --format '{{.Id}}' "peat-storage:ci-$arch")
            loaded_c=$(docker image inspect --format '{{.Id}}' "peat-compute:ci-$arch")
            # Not "test -n a && test -n b": a failed && list does not stop a bash -e script.
            [ -n "${!want_s}" ] || { echo "::error::no checked storage image ID ($arch)"; exit 1; }
            [ -n "${!want_c}" ] || { echo "::error::no checked compute image ID ($arch)"; exit 1; }
            [ "$loaded_s" = "${!want_s}" ] || { echo "::error::storage image ($arch) $loaded_s is not the checked ${!want_s}"; exit 1; }
            [ "$loaded_c" = "${!want_c}" ] || { echo "::error::compute image ($arch) $loaded_c is not the checked ${!want_c}"; exit 1; }
            echo "$arch: both loaded images are the checked ones"
          done

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/zabaca/peat/storage and ghcr.io/zabaca/peat/compute-pg18, tagged with the
      # full commit hash on a merge to main, or with the release tag's name: each tag one
      # multi-arch image (arm64 and amd64), made by .github/peat/push-images.sh.
      - name: Push
        env:
          REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: .github/peat/push-images.sh "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" "$TAG"
