name: Lint GitHub Workflows

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/*.ya?ml'
      - '.github/actionlint.yml'
  pull_request:
    paths:
      - '.github/workflows/*.ya?ml'
      - '.github/actionlint.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          # SC2046 and SC2086 (unquoted expansions) are allowed, as in upstream Neon.
          SHELLCHECK_OPTS: --exclude=SC2046,SC2086
        run: |
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Workflows run only on GitHub-hosted runners
        run: |
          if grep -nE '^\s*runs-on:.*self-hosted' .github/workflows/*.yml; then
            echo "::error::A workflow asks for a self-hosted runner; this repository has none"
            exit 1
          fi
